            position: relative;

        body::before {

            text-shadow: 0 0 10px #00ff00;
        }

        .text-terminal {
            border: 1px solid #00ff00;
            background-color: rgba(5, 5, 5, 0.9);
            padding: 16px;
            margin-bottom: 25px;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
            font-size: clamp(13px, 3.8vw, 16px);
            box-shadow: inset 0 0 15px rgba(0, 255, 0, 0.1), 0 0 10px rgba(0, 255, 0, 0.2);
            max-height: 400px;
            overflow-y: auto;
        }

        .log-header {
            border-bottom: 1px dashed #00ff00;
            padding-bottom: 8px;
            margin-bottom: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* SYÖTEKENTTÄ PROMPTAAMISTA VARTEN */
        .input-terminal {
            border: 1px solid #00ff00;
            background-color: rgba(5, 5, 5, 0.9);
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }

        .input-prompt {

            margin-right: 10px;
            font-size: 16px;
        }

        .prompt-input {
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: inherit;
            font-size: 16px;
            width: 100%;
            outline: none;
        }

        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .image-card {
            border: 1px solid #00ff00;
            background-color: rgba(5, 5, 5, 0.9);
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }

        .image-card img {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 10px;
            object-fit: contain;
        }

        .image-card span {
            font-size: clamp(11px, 3vw, 13px);
            letter-spacing: 2px;
            display: block;
        }

        ::selection {
            background: #00ff00;
            color: #000000;
        }

        @media (max-width: 600px) {
            body { padding: 8px; }
            .text-terminal, .input-terminal { padding: 12px; }
            .matrix-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .image-card { padding: 8px; }
        }

        @media (max-width: 380px) { .matrix-grid { grid-template-columns: 1fr; } }

        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;

    <!-- HÄMÄYSLASKURIN MOOTTORI -->
    <script>
        const TOTAL_SECONDS = 96 * 60 * 60;
        let startTime = sessionStorage.getItem("matrix_timer_start");
        if (!startTime) {
            startTime = Date.now();
            sessionStorage.setItem("matrix_timer_start", startTime);
        }
        function updateTimer() {
            const now = Date.now();
            const elapsedSeconds = Math.floor((now - startTime) / 1000);
            let remainingSeconds = TOTAL_SECONDS - elapsedSeconds;
            if (remainingSeconds <= 0) { remainingSeconds = 0; clearInterval(timerInterval); }
            const hours = Math.floor(remainingSeconds / 3600);
            const minutes = Math.floor((remainingSeconds % 3600) / 60);
            const seconds = remainingSeconds % 60;
            document.getElementById("timer-display").innerText = 
                String(hours).padStart(2, '0') + ":" + String(minutes).padStart(2, '0') + ":" + String(seconds).padStart(2, '0');
        }
        updateTimer();
        const timerInterval = setInterval(updateTimer, 1000);
    </script>
