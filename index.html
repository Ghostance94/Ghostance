
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE VAULT // GHOSTARY SYSTEM</title>
    <style>
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            color: #39FF14;
            font-family: monospace;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            display: block;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }
        .ui-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
            width: 100%;
        }
        /* Iso aloitusnäkymä kellolle ja spiraalille */
        .full-screen-spiral {
            width: 100vw;
            height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .spiral-svg {
            position: absolute;
            width: 90vw;
            max-width: 500px;
            height: 90vw;
            max-height: 500px;
            animation: rotateSpiral 12s linear infinite;
        }
        @keyframes rotateSpiral {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .system-clock {
            position: relative;
            z-index: 3;
            font-size: 2.2rem;
            color: #FFFFFF;
            text-shadow: 0 0 10px #39FF14, 0 0 20px #39FF14, 0 0 30px #39FF14;
            letter-spacing: 4px;
            font-weight: bold;
        }
        /* Tyylit chatti-ikkunalle ja telemetrialle */
        .content-panel {
            background: rgba(0,0,0,0.85);
            padding: 20px;
            border: 1px solid rgba(57,255,20,0.3);
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 30px;
        }
        .chat-terminal {
            text-align: left;
        }
        .chat-logs {
            height: 160px;
            overflow-y: auto;
            font-size: 0.75rem;
            margin-bottom: 8px;
            background: rgba(0,0,0,0.9);
            padding: 10px;
            border: 1px solid rgba(57,255,20,0.15);
            line-height: 1.4;
        }
        .chat-input-row input {
            width: 100%;
            background: #000;
            border: 1px solid #39FF14;
            color: #FFF;
            padding: 10px;
            font-family: monospace;
            box-sizing: border-box;
        }
        .chat-input-row input:focus {
            outline: none;
            box-shadow: 0 0 8px #39FF14;
        }
        .telemetry-box {
            margin-top: 15px;
            border-top: 1px dashed rgba(57,255,20,0.3);
            padding-top: 15px;
            text-align: left;
            font-size: 0.75rem;
            color: #a2ffa2;
            line-height: 1.4;
        }
        /* Uusi 2x2 ruudukko täysikokoisille vihjekuville */
        .image-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 50px;
        }
        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(57,255,20,0.2);
            padding: 5px;
        }
        .grid-item img {
            width: 100%;
            height: auto; /* Näyttää kuvan täysin kokonaisena alkuperäisellä suhteella */
            display: block;
        }
        .image-label {
            font-size: 0.65rem;
            color: #00FFD8;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .bottom-panel {
            margin-top: 15px;
            width: 100%;
            min-height: 50px;
            border: 1px dashed rgba(57,255,20,0.3);
            padding: 10px;
            box-sizing: border-box;
            background: rgba(0,10,0,0.8);
            text-align: center;
        }
        .laser-flash {
            animation: flashAnimation 0.5s ease-out;
        }
        @keyframes flashAnimation {
            0% { background: rgba(0, 255, 0, 0.5); }
            100% { background: rgba(0, 0, 0, 0.85); }
        }
    </style>
</head>
<body>

    <!-- Matrix-sade taustalla -->
    <canvas id="matrixCanvas"></canvas>

    <div class="ui-container">
        
        <!-- 1. ISO SPIRAALI JA KELLO -->
        <div class="full-screen-spiral">
            <svg class="spiral-svg" viewBox="0 0 200 200">
                <path d="M100,100 C110,90 110,70 95,65 C70,55 50,90 60,115 C75,150 130,150 150,115 C175,70 140,20 90,25 C30,30 10,100 35,150 C65,210 170,210 190,135" 
                      fill="none" stroke="#39FF14" stroke-width="2.5" stroke-linecap="round" opacity="0.9" filter="drop-shadow(0px 0px 8px #39FF14)"/>
            </svg>
            <div class="system-clock" id="systemClock">96:00:00</div>
        </div>
        
        <!-- 2. PROMPTIT JA TELEMETRIAT (Siirretty ylemmäs) -->
        <div class="content-panel" id="centerPanel">
            <div class="chat-terminal">
                <div class="chat-logs" id="chatLogs"></div>
                <div class="chat-input-row">
                    <input type="text" id="inputField" placeholder="Enter command...">
                </div>
            </div>

            <div class="telemetry-box">
                // SYSTEM ENGINE TELEMETRY<br>
                201-SYSTEM telemetry logs verified. Quantitative systems validation running real-time diagnostics on localized distributed network directories.
            </div>

            <div class="bottom-panel" id="dataBox" style="display: none;">
                <div>[SYSTEM DETECTED: KEY DECRYPTED]</div>
            </div>
        </div>

        <!-- 3. KUVAT JÄRJESTYKSESSÄ 2X2 RUUDUKOSSA (Ei enää rajattuja kortteja) -->
        <div class="image-grid">
            <!-- Kuva 1 -->
            <div class="grid-item">
                <img src="POPcorn.jpg" alt="Chapter I">
                <div class="image-label">Chapter I</div>
            </div>
            <!-- Kuva 2 -->
            <div class="grid-item">
                <img src="Library.jpg" alt="Chapter II">
                <div class="image-label">Chapter II</div>
            </div>
            <!-- Kuva 3 -->
            <div class="grid-item">
                <img src="Einstein.jpg" alt="Chapter III">
                <div class="image-label">Chapter III</div>
            </div>
            <!-- Kuva 4 -->
            <div class="grid-item">
                <img src="Shovel.jpg" alt="Chapter IV">
                <div class="image-label">Chapter IV</div>
            </div>
        </div>

    </div>

    <script>
        // Matrix-sade taustalle
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        const columns = Math.floor(width / 20) + 1;
        const yPositions = Array.from({ length: columns }).fill(0);

        function matrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#39FF14';
            ctx.font = '15pt monospace';
            yPositions.forEach((y, index) => {
                const text = String.fromCharCode(Math.floor(Math.random() * 128));
                const x = index * 20;
                ctx.fillText(text, x, y);
                if (y > 100 + Math.random() * 10000) yPositions[index] = 0;
                else yPositions[index] = y + 20;
            });
        }
        setInterval(matrix, 50);

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // 96 tunnin juokseva kello
        let totalSeconds = 96 * 3600;
        const clockElement = document.getElementById('systemClock');
        
        function updateClock() {
            if (totalSeconds > 0) totalSeconds--;
            const hrs = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;
            clockElement.innerText = 
                String(hrs).padStart(2, '0') + ':' + 
                String(mins).padStart(2, '0') + ':' + 
                String(secs).padStart(2, '0');
        }
        setInterval(updateClock, 1000);

        // Chatin toiminnallisuus ja korjattu komentoloki
        const inputField = document.getElementById('inputField');
        const dataBox = document.getElementById('dataBox');
        const chatLogs = document.getElementById('chatLogs');
        const centerPanel = document.getElementById('centerPanel');

        const TRIGGER_WORDS = ["SALASANA", "AVAIN", "KOODI"];
        const myGhostID = "COINING_PROFIT";

        function appendToChat(sender, message, isSystem = false) {
            const msg = document.createElement('div');
            msg.style.marginBottom = '4px';
            msg.style.color = isSystem ? '#FF3B30' : '#39FF14';
            msg.innerText = `[${sender}]: ${message}`;
            chatLogs.appendChild(msg);
            chatLogs.scrollTop = chatLogs.scrollHeight;
        }

        appendToChat('SYSTEM', 'GHOSTARY TERMINAL ONLINE.', true);

        inputField.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
const rawInput = inputField.value;
const cleanInput = rawInput.toUpperCase().trim();
if (!cleanInput) return;
if (cleanInput === "CHEMISTRY") {
appendToChat('SYSTEM', "MOLECULAR MATRIX ENGAGED: Scanning chemical prompt layers...", true);
setTimeout(() => { appendToChat('SYSTEM', "REACTION CONFIRMED: High-precision chemistry calculated on paper layers.", true); }, 800);
setTimeout(() => { appendToChat('SYSTEM', "FREQUENCY RESONANCE: Premium choux techniques are sealed directly into the [C4, E4, G4m] sequence. The technique remains a closed secret.", true); }, 1800);
inputField.value = '';
return;
}
if (cleanInput === "CHESS" || cleanInput === "SHAKH" || cleanInput === "MAT" || cleanInput === "QUEEN" || cleanInput.includes("COORDINATES")) {
appendToChat('SYSTEM', "TACTICAL CHESSBOARD MONITOR ACTIVATED...", true);
setTimeout(() => { appendToChat('SYSTEM', "STATE: Plate is empty. Game finished. Real psychological aikido verified.", true); }, 800);
setTimeout(() => { appendToChat('SYSTEM', "ANALYSIS: Who has the last Queen left? The endgame coordinates are hidden across multiple vector fields simultaneously.", true); }, 1800);
inputField.value = '';
return;
}
if (cleanInput === "FIBONACCI" || cleanInput === "CRYPTEX" || cleanInput === "ENIGMA" || cleanInput === "DA VINCI") {
appendToChat('SYSTEM', "CRYPTOGRAPHIC DECRYPTOR INITIATED...", true);
setTimeout(() => { appendToChat('SYSTEM', "RECURSION: Capitalized psychological beacons detected. Forward and backward word-pairs linked through golden ratio filters.", true); }, 800);
setTimeout(() => { appendToChat('SYSTEM', "WARNING: Cryptex alignment spans 75 operational locks. Symmetric data-siphon requires multi-tier key validation.", true); }, 1800);
inputField.value = '';
return;
}
if (cleanInput === "GAUSS" || cleanInput === "CURVE" || cleanInput === "FRAKTAL" || cleanInput === "FRACTAL" || cleanInput === "DENSITY") {
appendToChat('SYSTEM', "CRITICAL DATA NOTICE: Layered text-matrix detected.", true);
setTimeout(() => { appendToChat('SYSTEM', "STRUCTURE: Narrative is fractally engineered. Multi-tier injection addresses bots, support humans, and the ledger public simultaneously.", true); }, 800);
setTimeout(() => { appendToChat('SYSTEM', "WARNING: Symmetrical Gaussian Density validation requires 100% of the transmission tokens.", true); }, 1800);
setTimeout(() => { appendToChat('SYSTEM', "STATUS: Locked. Remaining sequence segments are obscured across the 14-week timeline. Full mathematical validation unseals at Week 10.", true); }, 2800);
inputField.value = '';
return;
}
let isMatch = TRIGGER_WORDS.some(word => cleanInput.includes(word));
if (cleanInput.includes("TIME TO GET POPCORNS")) isMatch = true;
if (isMatch) {
dataBox.style.display = 'block';
centerPanel.classList.add('laser-flash');
setTimeout(() => { centerPanel.classList.remove('laser-flash'); }, 500);
appendToChat('SYSTEM', "UNSEALED CORE KEY!", true);
inputField.value = '';
return;
}
appendToChat(myGhostID, rawInput);
inputField.value = '';
}
});
