<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE VAULT // SCAMBUST PORTAL</title>
    <style>
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        /* Joustava käyttöliittymäkerros Canvasin päällä */
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            pointer-events: none;
        }
        .center-panel {
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 4px;
            border: 1px solid rgba(57, 255, 20, 0.25);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.95);
            pointer-events: auto;
            width: 100%;
            max-width: 380px;
        }
        #timer {
            font-size: 2.5rem;
            font-weight: bold;
            color: #FFFFFF;
            text-shadow: 0 0 20px rgba(57, 255, 20, 0.6);
            font-family: monospace;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .ad-wrapper {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            border-top: 1px dashed rgba(57, 255, 20, 0.3);
            padding-top: 15px;
        }
        .ad-text {
            font-size: 0.65rem;
            color: #39FF14;
            opacity: 0.5;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .ad-wrapper iframe {
            width: 120px;
            height: 60px;
            border: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent;
        }
        @media (min-width: 480px) {
            #timer { font-size: 3.2rem; }
            .center-panel { max-width: 420px; }
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <!-- Puhdas käyttöliittymäkerros ilman päällekkäisiä piirtoja -->
    <div class="ui-container">
        <div class="center-panel">
            <div id="timer">00:00:00</div>
            <div id="adSpace" class="ad-wrapper">
                <div class="ad-text">Ad Content Matrix here</div>
                <iframe data-aa="515932" src="//://a-ads.com" block-mix="true"></iframe>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();

        const TOTAL_DURATION_MS = 96 * 60 * 60 * 1000;
        let startTime = localStorage.getItem('ghostary_inception_time') || Date.now();
        localStorage.setItem('ghostary_inception_time', startTime);
        startTime = parseInt(startTime, 10);

        const katakana = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const alphabet = katakana.split("");
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let rainDrops = Array(Math.floor(columns)).fill(1);

        let rotationOffset = 0; 

        function draw() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. MATRIX-KOODISADE
            ctx.fillStyle = 'rgba(0, 255, 0, 0.15)';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }

            // 2. AIKALASKENTA JA SYNKRONOINTI DOMIIN
            const now = Date.now();
            const elapsed = now - startTime;
            const remaining = TOTAL_DURATION_MS - (elapsed % TOTAL_DURATION_MS);
            const progressRatio = remaining / TOTAL_DURATION_MS;

            if (remaining > 0) {
                let totalSeconds = Math.floor(remaining / 1000);
                let hours = Math.floor(totalSeconds / 3600);
                let minutes = Math.floor((totalSeconds % 3600) / 60);
                let seconds = totalSeconds % 60;

                hours = String(hours).padStart(2, '0');
                minutes = String(minutes).padStart(2, '0');
                seconds = String(seconds).padStart(2, '0');

                document.getElementById('timer').textContent = `${hours}:${minutes}:${seconds}`;
            }

            // 3. PIIRRETÄÄN FIBONACCI-SPIRAALI (Skaalautuu automaattisesti ruutuun)
            if (progressRatio > 0) {
                ctx.strokeStyle = '#39FF14';
                ctx.lineWidth = 1.5;
                
                ctx.beginPath();
                let angle = 0;
                let a = 0.35 * progressRatio; 
                let b = 0.14; 
                
                const currentScale = Math.min(canvas.width, canvas.height) * 0.0011 * progressRatio;

                for (let i = 0; i < 280; i++) {
                    angle = i * 0.1 + rotationOffset; 
                    let r = a * Math.exp(b * (i * 0.1)) * (currentScale * 550);
                    let x = centerX + r * Math.cos(angle);
                    let y = centerY + r * Math.sin(angle);
                    
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                rotationOffset += 0.025; 
            }
        }

        setInterval(draw, 33);

        window.addEventListener('resize', () => {
            resizeCanvas();
            columns = canvas.width / fontSize;
            rainDrops = Array(Math.floor(columns)).fill(1);
        });
    </script>
</body>
</html>
